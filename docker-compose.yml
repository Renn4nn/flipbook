services:
  ctd-flipbook-db:
    image: postgres:17-alpine
    hostname: db
    container_name: ctd-flipbook-db
    restart: always
    env_file: .env.database.production
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - ctd-flipbook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  ctd-flipbook-api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: ctd-flipbook-api:latest
    hostname: api
    container_name: ctd-flipbook-api
    restart: always
    env_file:
      - .env.database.production
      - ./apps/api/.env.production
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      ctd-flipbook-db:
        condition: service_healthy
        restart: true
    networks:
      - ctd-flipbook-network

  ctd-flipbook-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    image: ctd-flipbook-web:latest
    hostname: web
    container_name: ctd-flipbook-web
    restart: always
    env_file:
      - ./apps/web/.env.production
    ports:
      - '3000:3000'
    depends_on:
      ctd-flipbook-db:
        condition: service_healthy
        restart: true
      ctd-flipbook-api:
        condition: service_started
    networks:
      - ctd-flipbook-network

networks:
  ctd-flipbook-network:
    name: ctd-flipbook-network
